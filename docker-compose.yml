services:
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      SESSION_DB_PATH: /data/bi_agent_sessions.sqlite3
      WEB_ORIGIN: http://gateway
    volumes:
      - bi_agent_data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    expose:
      - "3000"
    restart: unless-stopped

  gateway:
    image: caddy:2-alpine
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    expose:
      - "80"
    networks:
      default:
      taxonomy_edge:
        aliases:
          - bi-agent-gateway
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  bi_agent_data:

networks:
  taxonomy_edge:
    external: true
    name: onoff-taxonomy-organizer_default
