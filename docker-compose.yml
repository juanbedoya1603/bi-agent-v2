services:
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      SESSION_DB_PATH: /data/bi_agent_sessions.sqlite3
      WEB_ORIGIN: http://gateway
    volumes:
      - bi_agent_data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    expose:
      - "3000"
    restart: unless-stopped

  gateway:
    image: caddy:2-alpine
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    expose:
      - "80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    command: tunnel --no-autoupdate --url http://gateway:80
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  bi_agent_data:
