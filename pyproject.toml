[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bi-agent-api"
version = "0.1.0"
description = "Asistente interno de BI sobre SQL Server"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "openai-agents>=0.22,<0.23",
    "pydantic-settings>=2.7,<3",
    "pyodbc>=5.2,<6",
    "sqlglot>=27,<29",
    "tzdata>=2025.2; sys_platform == 'win32'",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/bi_agent_api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["apps/api/tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps/api/src", "apps/api/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
